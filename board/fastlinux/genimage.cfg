image boot.vfat {
 vfat {
  files = { "Image", "bcm2710-rpi-zero-2-w.dtb", "rpi-firmware/bootcode.bin", "rpi-firmware/start.elf", "rpi-firmware/fixup.dat", "rpi-firmware/config.txt", "rpi-firmware/BOOT-README.txt", "rpi-firmware/cmdline.txt", "rpi-firmware/overlays" }
 }
 size = 64M
}
image sdcard.img {
 hdimage { }
 partition boot { partition-type = 0xC bootable = "true" offset = 1M image = "boot.vfat" }
 partition rootfs { partition-type = 0x83 image = "rootfs.ext4" }
 partition data { partition-type = 0x83 image = "data.ext4" }
}
