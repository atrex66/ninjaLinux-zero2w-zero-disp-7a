<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ninjaLinux · Files</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="mark">▰▰▰</span> <strong>ninjaLinux</strong><span data-t="title">Fájlkezelő</span></div><button id="language">EN</button></header>
<main><section id="login" class="card login"><h1 data-t="welcome">Távoli fájlkezelő</h1><p data-t="intro">A készülék /data könyvtárának kezelése.</p>
<form id="login-form"><label for="token" data-t="code">Belépési kód</label><input id="token" type="password" autocomplete="current-password" required minlength="24" maxlength="128"><button type="submit" class="primary" data-t="connect">Kapcsolódás</button></form></section>
<section id="explorer" hidden><div class="toolbar"><button id="up" data-t="up">↑ Fel</button><button id="refresh" data-t="refresh">Frissítés</button><button id="new-folder" data-t="folder">Új mappa</button><button id="upload" class="primary" data-t="upload">Feltöltés</button><button id="logout" data-t="logout">Kilépés</button><input id="files" type="file" multiple hidden></div>
<nav id="breadcrumbs" aria-label="Path"></nav><div class="card table-wrap"><table><thead><tr><th data-t="name">Név</th><th data-t="size">Méret</th><th data-t="modified">Módosítva</th><th data-t="actions">Műveletek</th></tr></thead><tbody id="entries"></tbody></table><p id="empty" data-t="empty" hidden>Üres mappa.</p></div><p class="hint" data-t="hint">A kapcsolat igény szerint automatikusan újraindul. A rendszerkönyvtárak nem érhetők el.</p></section>
<p id="status" role="status" aria-live="polite"></p>
</main><dialog id="editor"><form method="dialog"><header><strong id="editor-name"></strong><button data-t="close">Bezárás</button></header></form><textarea id="text" spellcheck="false"></textarea><div class="editor-actions"><button id="save" class="primary" data-t="save">Mentés</button></div></dialog></body></html>
