# Local hand-controller network only. No DNS service or internet gateway.
port=0
interface=wlan0
bind-interfaces
dhcp-authoritative
dhcp-range=192.168.4.20,192.168.4.100,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/run/ninjalinux-wifi-ap.leases
pid-file=/run/dnsmasq-wlan0.pid
